version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syns-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: syns
      POSTGRES_PASSWORD: syns_dev_password
      POSTGRES_DB: syns
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

